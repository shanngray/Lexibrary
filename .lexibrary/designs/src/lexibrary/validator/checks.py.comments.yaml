comments:
- body: Replaced local _WIKILINK_RE and _HTML_COMMENT_RE regex definitions with imports
    from lexibrary.wiki.patterns. All six _WIKILINK_RE.findall() call sites and three
    _HTML_COMMENT_RE.sub() call sites remain unchanged via import aliases. This is
    a pure refactor with no behavioral change - the validator continues using raw
    .findall() results rather than the higher-level extract_wikilinks() function because
    it needs per-match processing (strip/lowercase) and in some cases all matches
    including duplicates.
  date: '2026-04-07T22:14:19.709865Z'
- body: check_config_valid now additionally calls resolved_scope_roots(project_root)
    after Pydantic validation succeeds, so resolve-time guards (path-traversal, nested-roots,
    duplicate entries) surface as config_valid validation errors via lexi validate
    instead of silently crashing in downstream commands. Closes ST-043 gap identified
    during multi-root end-to-end verification.
  date: '2026-04-17T20:26:51.001835Z'
- body: 'Added check_parseable_artifacts: an error-severity check that walks each
    artifact directory under .lexibrary/ and dispatches every *.md file to its kind''s
    strict parser variant. Catches *ValidationError and threads the parser''s full
    self-describing detail (field, bad value, accepted set) into the finding''s message
    verbatim. Defensive Exception branch ensures one corrupt file can''t crash the
    whole check. Strict parsers are looked up via getattr on the module so monkeypatching
    at the validator-checks boundary works for tests. Closes the gap where lenient
    parsers silently dropped malformed artifacts from the index.'
  date: '2026-04-28T02:26:54.255874Z'
